name: Build Hvati APK

on:
  push:
    branches:
      - hvati-apk-v1
    paths:
      - 'hvati/**'
      - '.github/workflows/build-hvati-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'hvati/**'
      - '.github/workflows/build-hvati-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: hvati
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp hvati/app/build/outputs/apk/debug/app-debug.apk Hvati-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hvati-v1
          path: Hvati-v1.apk
          retention-days: 1
