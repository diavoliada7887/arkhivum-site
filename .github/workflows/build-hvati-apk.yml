name: Build Hvati APK

on:
  push:
    branches:
      - hvati-apk-v1
    paths:
      - 'hvati/**'
      - '.github/workflows/build-hvati-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'hvati/**'
      - '.github/workflows/build-hvati-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: hvati
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Re-sign APK for sideload compatibility
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Hvati-v2.apk \
            hvati/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          echo "=== APK SIGNATURE ==="
          "$APKSIGNER" verify --verbose --print-certs Hvati-v2.apk
          echo "=== APK BADGING ==="
          "$AAPT" dump badging Hvati-v2.apk | head -40

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hvati-v2
          path: Hvati-v2.apk
          retention-days: 1
